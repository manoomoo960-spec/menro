const topT=()=>{const a=DB.teachers.map(t=>[t,DB.tasks.filter(x=>x.teacherId==t.id&&mk(x.created)==thisM).length]).sort((a,b)=>b[1]-a[1])[0];return a&&a[1]?`<div class="card" style="margin-top:12px">${ic('crown')} أكثر مدرس طلباً هذا الشهر: <b class="gold">${esc(a[0].name)}</b> (${a[1]} تصميم)</div>`:''};
const bestD=()=>{const a=DB.designers.map(d=>[d,DB.tasks.filter(t=>t.designerId==d.id&&t.status!='done').length]).sort((x,y)=>x[1]-y[1])[0];if(!a)return toast('أضف مصمم أولاً');$('#td').value=a[0].id;toast('الأنسب: '+a[0].name+' ('+a[1]+' جاري)')};
async function msgTe(id){if(!aiOn())return noAI();const t=T(id),fs=DB.tasks.filter(x=>x.teacherId==id),c=fs.filter(x=>mk(x.created)==thisM).length,d=fs.filter(x=>x.status=='done'&&mk(x.doneAt)==thisM).length;modal(`<h3>رسالة للمدرس</h3><p class="mut sm"><i class="spin"></i>جاري الكتابة...</p>`);try{const o=await gem([{role:'user',parts:[{text:`اكتب رسالة واتساب ودودة ومحترفة بالعربية المصرية من وكالة بيمرو للمدرس "${t.name}" (مادة ${t.subject||'-'}) عن حالة باقته: باقته ${t.quota} تصميم شهرياً، تم طلب ${c} وتسليم ${d} هذا الشهر.${c>=(+t.quota||1)?' الباقة اكتملت واقترح التجديد.':''} اكتب الرسالة فقط.`}]}]);modal(`<h3>رسالة للمدرس</h3><textarea id="bk">${esc(o)}</textarea><button class="btn o" onclick="closeM()">إغلاق</button>`)}catch(e){closeM();errAI(e)}}
function anDs(id){if(!aiOn())return noAI();const d=D(id),b=bal(d),m=DB.tasks.filter(t=>t.designerId==id);aiShow('تحليل أداء '+d.name,`حلل أداء مصمم في وكالة تصميم: منجز ${b.n}، هذا الشهر ${b.nm}${d.goal?' من هدف '+d.goal:''}، جاري ${m.filter(t=>t.status!='done').length}، متأخر ${m.filter(late).length}، مرات حظر التقليد ${m.reduce((a,t)=>a+(t.blocks||[]).length,0)}${avg(id)?'، متوسط التقييم'+avg(id):''}. اكتب بالعربية: نقاط القوة، ما يحتاج تحسيناً، و3 توصيات للـ CEO.`)}
render();
</script><script src="menro.js"></script>
